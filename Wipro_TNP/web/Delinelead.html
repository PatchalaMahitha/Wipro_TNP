<!DOCTYPE html>
<html>
<head>

    <title>Book Types</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="css/bootstrap.min.css">

    <style>

        .book-button {
            margin: 5px;
            padding: 12px 25px;
            border: none;
            color: white;
            border-radius: 5px;
        }

        .fiction {
            background-color: white;
            color: black;
            border: 1px solid black;
        }

        .kids {
            background-color: darkblue;
        }

        .teens {
            background-color: green;
        }

        .scientific {
            background-color: lightblue;
            color: black;
        }

        .crime {
            background-color: red;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Book Types</h2>

    <div>

        <button class="book-button fiction">
            Fiction
        </button>

        <button class="book-button kids">
            Kids
        </button>

        <button class="book-button teens">
            Teens
        </button>

        <button class="book-button scientific">
            Scientific
        </button>

        <button class="book-button crime">
            Crime / Thriller / Horror
        </button>

    </div>

    <hr>

    <h2>Feedback</h2>

    <p>Choose your preferred font size:</p>

    <button class="btn btn-primary btn-lg">
        Large
    </button>

    <button class="btn btn-primary">
        Medium
    </button>

    <button class="btn btn-primary btn-sm">
        Small
    </button>

</div>

</body>
</html>
