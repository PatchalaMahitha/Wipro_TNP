<!DOCTYPE html>
<html>
<head>
    <title>Visitor Information</title>
</head>
<body>

<table align="center" border="1" cellpadding="10">

<tr>
    <td>

        <h2 align="center">Visitor Information</h2>

        <hr>

        <form>

            <label>Email Address:</label>
            <input type="email" name="email">

            <br><br>

            <label>User's Interest:</label>

            <input type="checkbox" name="interest" value="research">
            Research

            <input type="checkbox" name="interest" value="purchase">
            Purchase

            <br><br>

            <label>Occupation:</label>

            <select name="occupation">
                <option value="">Select One</option>
                <option>Student</option>
                <option>Employee</option>
                <option>Business</option>
                <option>Teacher</option>
                <option>Other</option>
            </select>

            <br><br>

            <label>Want us to send you junk emails?</label>

            <input type="radio" name="junk" value="yes">
            Absolutely

            <input type="radio" name="junk" value="no">
            No way man

            <br><br>

            <input type="submit" value="Submit">

            <input type="reset" value="Reset">

        </form>

    </td>
</tr>

</table>

</body>
</html>
