<!DOCTYPE html>
<html>

<head>
    <title>Frames Example</title>
</head>

<frameset rows="30%,70%">

    <!-- Top 30% -->
    <frame src="top.html" name="topFrame">

    <!-- Bottom 70% -->
    <frameset cols="30%,70%">

        <!-- Left 30% -->
        <frame src="menu.html" name="leftFrame">

        <!-- Right 70% -->
        <frame src="font.html" name="rightFrame">

    </frameset>

</frameset>

</html>
