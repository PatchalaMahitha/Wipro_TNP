<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model - Q5</title>

    <style>
        .first {
            padding-left: 3cm;
            background-color: lightblue;
        }

        .second {
            padding-right: 50%;
            background-color: lightgreen;
        }

        .third {
            padding-bottom: 25%;
            background-color: lightyellow;
        }

        .fourth {
            padding-top: 25%;
            background-color: lightpink;
        }
    </style>
</head>

<body>

    <p class="first">
        First paragraph - left padding is 3cm.
    </p>

    <p class="second">
        Second paragraph - right padding is 50%.
    </p>

    <p class="third">
        Third paragraph - bottom padding is 25%.
    </p>

    <p class="fourth">
        Fourth paragraph - top padding is 25%.
    </p>

</body>
</html>
