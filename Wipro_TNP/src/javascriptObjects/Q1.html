<!DOCTYPE html>
<html>
<head>
    <title>First Occurrence</title>
</head>
<body>

<script>
    let txt = "Hello World, Welcome to the World";

    let position = txt.indexOf("World");

    document.write("Text: " + txt + "<br>");
    document.write("First occurrence of World is at position: " + position);
</script>

</body>
</html>
