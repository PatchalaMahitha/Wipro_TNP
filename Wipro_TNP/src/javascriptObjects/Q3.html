<!DOCTYPE html>
<html>
<head>
    <title>Remove Characters</title>
</head>
<body>

<script>
    function removeCharacters(str, number) {
        return str.slice(number);
    }

    let text = "JavaScript";
    let number = 4;

    document.write("Original String: " + text + "<br>");
    document.write("After removing " + number + " characters: ");
    document.write(removeCharacters(text, number));
</script>

</body>
</html>
