<!DOCTYPE html>
<html>
<head>
    <title>Change Background</title>

    <script>
        function changeBackground(color) {
            document.body.style.backgroundColor = color;
        }
    </script>
</head>

<body>

<h2>Choose Background Color</h2>

<a href="#" onclick="changeBackground('white'); return false;">White</a>
&nbsp;&nbsp;

<a href="#" onclick="changeBackground('red'); return false;">Red</a>
&nbsp;&nbsp;

<a href="#" onclick="changeBackground('blue'); return false;">Blue</a>
&nbsp;&nbsp;

<a href="#" onclick="changeBackground('pink'); return false;">Pink</a>

</body>
</html>
