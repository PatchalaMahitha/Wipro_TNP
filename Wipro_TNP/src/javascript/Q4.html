<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Assignment 4</title>
</head>
<body>

<h2>Convert First Letter to Uppercase</h2>

<script>
    function capitalizeWords(str) {
        return str
            .split(" ")
            .map(function(word) {
                return word.charAt(0).toUpperCase() + word.slice(1);
            })
            .join(" ");
    }

    let text = "hello world welcome to javascript";

    document.write("Original: " + text + "<br>");
    document.write("Result: " + capitalizeWords(text));
</script>

</body>
</html>
