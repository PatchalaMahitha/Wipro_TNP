<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Assignment 2</title>
</head>
<body>

<h2>Reverse a Number</h2>

<script>
    function reverseNumber(num) {
        return Number(String(num).split("").reverse().join(""));
    }

    let x = 32243;

    document.write("Original Number: " + x + "<br>");
    document.write("Reversed Number: " + reverseNumber(x));
</script>

</body>
</html>
