<body>

<h2>Palindrome Check</h2>

<script>
    function isPalindrome(str) {
        let reverse = str.split("").reverse().join("");

        if (str === reverse) {
            return true;
        } else {
            return false;
        }
    }

    let text = "madam";

    if (isPalindrome(text)) {
        document.write(text + " is a Palindrome");
    } else {
        document.write(text + " is not a Palindrome");
    }
</script>

</body>
</html>
