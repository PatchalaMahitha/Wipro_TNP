<!DOCTYPE html>
<html>
<head>
    <title>Link Background Colors</title>

    <style>
        a:link {
            background-color: #FF0000;
            color: white;
        }

        a:visited {
            background-color: #FFFF00;
            color: black;
        }

        a:hover {
            background-color: #FF00FF;
            color: white;
        }

        a:active {
            background-color: #0000FF;
            color: white;
        }
    </style>
</head>

<body>

    <h2>Link Background Color Example</h2>

    <a href="https://www.google.com">Google</a>

</body>
</html>
