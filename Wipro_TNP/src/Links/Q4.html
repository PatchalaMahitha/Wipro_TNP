<!DOCTYPE html>
<html>
<head>
    <title>Ordered List</title>

    <style>
        ol {
            list-style-type: lower-greek;
            text-align: left;
            color: red;
            text-transform: uppercase;
            text-decoration: underline;
            font-family: Verdana;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Ordered List</h2>

    <ol>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Mango</li>
    </ol>

</body>
</html>
