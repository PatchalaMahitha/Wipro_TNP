<!DOCTYPE html>
<html>
<head>
    <title>Unordered List</title>

    <style>
        ul {
            list-style-type: square;
            text-align: left;
            color: red;
            text-transform: uppercase;
            text-decoration: underline;
            font-family: Arial;
            font-size: 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Unordered List</h2>

    <ul>
        <li>Java</li>
        <li>HTML</li>
        <li>CSS</li>
        <li>Python</li>
    </ul>

</body>
</html>
