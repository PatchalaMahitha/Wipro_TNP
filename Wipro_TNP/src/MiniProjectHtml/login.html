<!DOCTYPE html>
<html>
<body>

<center>

    <h3 style="color: blue;">Account Login</h3>

    <form>

        <table border="1" cellpadding="8">

            <tr>
                <td><b>User Name:</b></td>
                <td>
                    <input type="text"
                           maxlength="8"
                           size="10">
                </td>
            </tr>

            <tr>
                <td><b>Password:</b></td>
                <td>
                    <input type="password"
                           maxlength="8"
                           size="10">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Login">
                </td>
            </tr>

        </table>

    </form>

</center>

</body>
</html>
