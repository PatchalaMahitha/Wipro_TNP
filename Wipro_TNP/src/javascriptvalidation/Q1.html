<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>

    <script>
        function validateForm() {

            // Get values
            let memberNumber = document.getElementById("memberNumber").value;
            let password = document.getElementById("password").value;

            // Validate Member Number
            if (memberNumber === "") {
                alert("Member number must be entered.");
                document.getElementById("memberNumber").focus();
                return false;
            }

            if (isNaN(memberNumber)) {
                alert("Member number must be a number.");
                document.getElementById("memberNumber").focus();
                return false;
            }

            // Validate Password
            if (password === "") {
                alert("Password must be entered.");
                document.getElementById("password").focus();
                return false;
            }

            if (password.length <= 4) {
                alert("Password must be longer than 4 characters.");
                document.getElementById("password").focus();
                return false;
            }

            alert("Form submitted successfully!");

            return true;
        }
    </script>
</head>

<body>

<h2>Member Login</h2>

<form onsubmit="return validateForm();">

    <label>Member Number:</label>
    <input type="text" id="memberNumber">

    <br><br>

    <label>Password:</label>
    <input type="password" id="password">

    <br><br>

    <input type="submit" value="Submit">

</form>

</body>
</html>
